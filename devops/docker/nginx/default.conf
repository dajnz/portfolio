# Text compression (nginx http context — conf.d files are included from
# the main nginx.conf). Enables the gzipped-JS Performance Budgets
# (architecture.md:1197-1210) to be measured against real transfers; the
# /assets/ RustFS proxy and already-compressed media stay untouched by
# the types whitelist. `gzip_proxied any` keeps compression behind the
# prod Traefik reverse proxy (the default `off` disables it for proxied
# requests). Compression of dynamic (PHP) and static responses alike.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/rss+xml
    application/json
    application/ld+json
    application/javascript
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # The DR upload carries backup archives up to the `backup_upload_max_size`
    # setting (default 100 MB) — nginx's default 1 MB limit would 413 them.
    client_max_body_size 100m;

    root /var/www/html/public;
    index index.php;

    # Assets proxy to RustFS (same-origin) — path-style per assumption A7:
    # DB stores only "blog/..."-style paths, public URLs are {APP_URL}/assets/{path},
    # and this location rewrites them to the "portfolio" bucket on RustFS.
    # Upload paths are content-addressed random names, so responses are
    # immutable once stored (cache-lifetime performance record, 13.3).
    location /assets/ {
        proxy_pass http://rustfs:9000/portfolio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hashed build output (Vite chunks + bundled fonts) — content-addressed
    # file names make every response immutable; the fonts stylesheet and
    # manifest.json stay outside this location (no-cache HTML flow).
    location /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brand images (logo/favicons/og/tiles) keep stable names across
    # redeploys, so a shorter max-age, without `immutable`.
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ACME challenge for certbot (Let's Encrypt HTTP-01 validation)
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Main application
    location / {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        # TLS dev mode: Traefik terminates TLS and sets X-Forwarded-Proto /
        # X-Forwarded-For — forward them so PHP-FPM/Laravel sees https and
        # the real client IP (Laravel honors them only when TRUSTED_PROXIES
        # is set — localhost mode/production leave it empty, so the params
        # stay empty/untrusted and the scheme/IP fall back to the connection).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), display-capture=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
}

