; Production php.ini overrides
; Upload limits accommodate the largest payload (backup restore uploads via admin
; UI, up to backup_upload_max_size). The max size is configurable per env; keep
; these at least 128M (the default backup_upload_max_size is 100 MB).
upload_max_filesize = 128M
post_max_size = 128M
; Uploaded images are decoded in memory for the WebP conversion pipeline
; (upload endpoint) — GD allocates a full 4-byte-per-pixel bitmap, so 128M
; (the PHP default) can be exceeded by a max-size high-resolution JPEG/PNG.
memory_limit = 256M
