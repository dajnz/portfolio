# Ansible inventory — the target-specific values (server IP, user, SSH key
# path, repository URL) live in the gitignored host_vars/<host>.yml files.
# `make deploy-init` / `make deploy-test-init` create the matching file from
# the committed *.example.yml; fill it in and keep it out of git.
#
# group_vars/all.yml maps the user-facing deploy_server_* variables to the
# Ansible connection settings, so the host_vars files stay free of
# Ansible-specific terminology.
#
# Usage:
#   make deploy GIT_REF=<tag-or-commit>            # production group
#   make deploy-test GIT_REF=<tag-or-commit>       # vm_test group
#   make rollback [SERVICE=<name>]                 # production group
#   make rollback-test [SERVICE=<name>]            # vm_test group
all:
  children:
    production:
      hosts:
        portfolio_prod:
    vm_test:
      hosts:
        portfolio_vm:
