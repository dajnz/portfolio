# Ansible inventory — production server credentials are NEVER committed.
# They are provided at runtime via environment variables (see devops.md
# "Ansible Inventory"): PROD_HOST, PROD_USER, PROD_SSH_KEY, and (for the
# first-deploy env provisioning) AGE_PRIVATE_KEY — secrets-management.md.
#
# Usage: make deploy GIT_REF=<tag-or-commit>   /   make rollback [SERVICE=<name>]
all:
  hosts:
    production:
      ansible_host: "{{ lookup('env', 'PROD_HOST') }}"
      ansible_user: "{{ lookup('env', 'PROD_USER') }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'PROD_SSH_KEY') }}"
