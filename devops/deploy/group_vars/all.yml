# Map the user-facing deployment target variables from host_vars/<host>.yml to
# the names Ansible's SSH connection plugin expects. Keep the host_vars files
# free of Ansible-specific connection terminology.
ansible_host: "{{ deploy_server_ip }}"
ansible_user: "{{ deploy_server_user }}"
ansible_ssh_private_key_file: "{{ deploy_server_ssh_key_path }}"
# Targets are Ubuntu; pin the distro interpreter instead of discovery.
ansible_python_interpreter: /usr/bin/python3
