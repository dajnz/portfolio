---
# Rollback playbook — devops.md "Ansible Rollback Playbook".
#
# Invoked via `make rollback` (production) or `make rollback-test` (vm-test),
# optionally with SERVICE=<name> (default: all services of the portfolio stack).
# Rolls each service back to its previous Swarm task specification — Swarm
# stores the previous spec per service, so this is a pure orchestrator-level
# operation: no image rebuild, no git interaction.
# Only the most recent update per service can be rolled back; to go back
# further use `make deploy GIT_REF=<older-commit>` instead.
# Swarm swaps the current and previous specs, so running rollback twice would
# return the service to the newer spec. Services whose last operation was
# already a rollback are skipped with a warning (exit 0); moving forward again
# requires a deploy, which in turn makes a later rollback possible.
#
#   1. Accept the optional service variable (default: all)
#   2. Skip the services whose last swarm operation was already a rollback
#   3. For each remaining service: docker service rollback
#      (a service without a previous spec is a no-op — tolerated)
#   4. Wait for the rollback to converge (no transitional tasks left)
#   5. Verify the replica counts of the whole stack
#
# The convergence wait is devops/deploy/scripts/wait-for-convergence.sh
# (shared with deploy.yml).
- name: Roll back portfolio services
  hosts: "{{ deploy_target | default('production') }}"
  gather_facts: false
  become: true
  vars:
    stack_name: portfolio
    rollback_wait_seconds: 600
    service: all

  tasks:
    - name: 0 | Validate the deployment target config
      ansible.builtin.import_tasks: tasks/assert_target_config.yml

    - name: 1 | List the services of the portfolio stack
      ansible.builtin.command:
        cmd: docker stack services --format "{% raw %}{{.Name}}{% endraw %}" {{ stack_name }}
      register: stack_services
      changed_when: false

    - name: 1 | Fail when the stack is not deployed
      ansible.builtin.fail:
        msg: "no services found in the {{ stack_name }} stack — is it deployed?"
      when: stack_services.stdout_lines | length == 0

    - name: 1 | Resolve the services to roll back
      ansible.builtin.set_fact:
        services_to_rollback: >-
          {{
            stack_services.stdout_lines
            | map('regex_replace', '^' + stack_name + '_', '')
            | list
            if service == 'all'
            else [service]
          }}

    - name: 1 | Fail when the requested service is not part of the stack
      ansible.builtin.fail:
        msg: "service '{{ service }}' is not part of the {{ stack_name }} stack"
      when: service != 'all' and service not in services_to_rollback

    # ---------------------------------------------------------------- 2
    # Swarm keeps a single previous spec per service and every rollback swaps
    # it with the current one, so an unguarded second run returns the service
    # to the spec it was just rolled back from. The persisted update state is
    # the only signal that distinguishes "already rolled back" from "a newer
    # spec was deployed since".
    - name: 2 | Read the last update state of each service
      ansible.builtin.command:
        cmd: >-
          docker service inspect {{ stack_name }}_{{ item }}
          --format "{% raw %}{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}{% endraw %}"
      loop: "{{ services_to_rollback }}"
      register: service_update_states
      changed_when: false

    - name: 2 | Collect the services whose last operation was a rollback
      ansible.builtin.set_fact:
        already_rolled_back: >-
          {{
            service_update_states.results
            | selectattr('stdout', 'search', 'rollback', True)
            | map(attribute='item')
            | list
          }}

    - name: 2 | Warn about the services that are already rolled back
      ansible.builtin.debug:
        msg: >-
          {{ already_rolled_back | join(', ') }}: the last swarm operation was
          already a rollback, so the service is still at its previous spec —
          skipping. Run `make rollback`/`make rollback-test` again only after
          a deploy (which also re-enables a later rollback).
      when: already_rolled_back | length > 0

    - name: 2 | Drop the services that are already rolled back
      ansible.builtin.set_fact:
        services_to_rollback: "{{ services_to_rollback | difference(already_rolled_back) }}"

    - name: 2 | Report when nothing is left to roll back
      ansible.builtin.debug:
        msg: "every selected service is already rolled back — nothing to do."
      when: services_to_rollback | length == 0

    # ---------------------------------------------------------------- 3
    # A service without a previous spec ("no previous spec" / "not currently
    # in an update") is a no-op, not an error — the wait below converges
    # immediately and the final listing verifies the state.
    - name: 3 | Roll back each service to its previous spec
      ansible.builtin.command:
        cmd: docker service rollback {{ stack_name }}_{{ item }}
      loop: "{{ services_to_rollback }}"
      failed_when: false
      changed_when: false

    # ---------------------------------------------------------------- 4
    - name: 4 | Wait for each rollback to converge
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/wait-for-convergence.sh
          {{ rollback_wait_seconds }}
          {{ stack_name }}_{{ item }}
      loop: "{{ services_to_rollback }}"

    # ---------------------------------------------------------------- 5
    - name: 5 | Verify the resulting service state
      ansible.builtin.command:
        cmd: >-
          docker service ls --filter name=portfolio_
          --format "{% raw %}{{.Name}}\t{{.Replicas}}\t{{.Image}}{% endraw %}"
      changed_when: false
