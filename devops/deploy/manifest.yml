# Image tag manifest — single source of truth for which image tag each
# swarm service runs. Tag values are short (7-character) git commit SHAs.
#
# Rules:
#   - app, queue and scheduler always share the same tag (same Dockerfile).
#   - node and nginx tags are independent — they only change when their
#     respective source files change.
#   - Updated automatically by the CI update-manifest job on every push to
#     main; the Ansible deployment playbook reads it from the deployed
#     GIT_REF. Never deploy from CI — deployment is manual via `make deploy`.
#   - The job pushes to main, so "GitHub Actions" must be on the main
#     ruleset's bypass list. Deploy from `main` (or tag after the manifest
#     commit) so the cloned release contains the updated tags.
services:
  app: "160c312"
  queue: "160c312"
  scheduler: "160c312"
  node: "160c312"
  nginx: "160c312"
