---
# Deployment playbook — devops.md "Ansible Deployment Playbook".
#
# Invoked via `make deploy` / `make deploy-test` (repo-root Makefile), on a
# fresh Ubuntu server. Runs the steps against the selected inventory group
# (`production` or `vm_test`) over SSH (no agent required — plain Ansible +
# SSH; target settings live in the gitignored host_vars/<host>.yml):
#
#   Profiles (`deploy_profile`, derived from `deploy_target`):
#     - production (default): /opt/portfolio/.env.prod, TLS via the certbot
#       service and the certbot_certs volume.
#     - vm-test: /opt/portfolio/.env.prod.test, TLS provided by the operator in
#       /opt/portfolio/tls/live/<DOMAIN>/{fullchain.pem,privkey.pem} (asserted
#       before any build). The certbot service is scaled to zero and nginx
#       bind-mounts that directory read-only. Selected by `make deploy-test`.
#
#   Prerequisite: Docker Engine 23+ installed and running on the target. The
#   playbook fails with a clear message otherwise and never installs it.
#
#   Sudo is interactive: `make deploy` / `deploy-test` / `rollback` pass
#   --ask-become-pass (set ASK_BECOME=0 for a passwordless-sudo target).
#
#   0. Pre-flight checks
#      - verify Docker Engine 23+ is installed/running and ensure the daemon
#        trusts the local registry (live reload; Docker is never installed)
#      a. docker swarm init when Swarm mode is inactive
#      b. create the attachable portfolio_prod overlay network when missing
#         (the stack joins it as an external network; one-off migration
#         containers attach to it to resolve `db`)
#      c. run the local image registry on 127.0.0.1:5000 when missing
#         (loopback-only container; no external port exposure)
#      d. FIRST DEPLOY ONLY — provision the profile env file from the
#         age-encrypted file generated by `make deploy-init` /
#         `make deploy-test-init` (secrets-management.md step 3)
#      e. vm-test only — assert the provided TLS certificate files exist
#   1. Clone the repository at git_ref (depth 1) into
#      /opt/portfolio/releases/<git_ref>
#   2. Read devops/deploy/manifest.yml (service -> image tag)
#   3. Compare the manifest tags with the tags of the running swarm services
#   4. Build the client assets (PHP needs the Vite manifest, nginx serves the
#      hashed files), then build + push only the images whose tag differs (or
#      whose baked env changed — the PHP image runs `php artisan config:cache`
#      at build time, fed by the env file through a BuildKit secret)
#   5. Run `php artisan migrate --force` before the stack update when the
#      database already exists (after the stack deploy on a first deploy)
#   6. Deploy the stack (envsubst over docker-compose.prod.yml with the
#      production env exported — compose interpolation carries the DB/Redis/
#      RustFS/DOMAIN configuration into the db/redis/rustfs/nginx services)
#   7. Wait for all portfolio services to converge
#   7b. Provision the RustFS buckets, public portfolio policy, and scoped
#       backups user with the official RustFS `rc` client
#   8. Prune old image tags from the local registry (keep current + previous)
#      and run registry garbage collection
#   9. Create the initial admin when missing and print the generated
#      credentials (the first successful deploy; skipped once an admin exists)
#
# Bash/Python snippets live in devops/deploy/scripts/ (shipped to the server
# via the `script:` module); this file stays a thin orchestrator of pure
# modules and docker CLI commands.
#
# Target connection settings live in devops/deploy/host_vars/<host>.yml
# (gitignored; copy the matching *.example.yml). The first deploy prompts for
# the AGE private key; setting AGE_PRIVATE_KEY in the environment skips the
# prompt for non-interactive runs.
- name: Deploy the portfolio stack
  hosts: "{{ deploy_target | default('production') }}"
  gather_facts: false
  become: true
  vars:
    release_root: /opt/portfolio
    deploy_wait_seconds: 600
    deploy_profile: "{{ 'vm-test' if (deploy_target | default('production')) == 'vm_test' else 'production' }}"
    tls_mode: "{{ 'provided' if deploy_profile == 'vm-test' else 'certbot' }}"
    env_prod_path: "{{ release_root }}/{{ '.env.prod.test' if deploy_profile == 'vm-test' else '.env.prod' }}"
    env_sha_path: "{{ release_root }}/{{ '.env.sha256.test' if deploy_profile == 'vm-test' else '.env.sha256' }}"
    local_env_age_file: "{{ playbook_dir }}/../../{{ '.env.prod.test.age' if deploy_profile == 'vm-test' else '.env.prod.age' }}"
    server_env_age_file: "{{ env_prod_path }}.age"
    tls_root: "{{ release_root }}/tls"
    compose_overlay: "{{ release_root }}/releases/{{ git_ref }}/devops/deploy/docker-compose.provided-tls.yml"

  tasks:
    - name: 0 | Validate the deployment target config
      ansible.builtin.import_tasks: tasks/assert_target_config.yml

    - name: 0 | Fail fast when GIT_REF is missing
      ansible.builtin.fail:
        msg: "git_ref is required — usage: make deploy GIT_REF=<tag-or-commit>"
      when: git_ref is not defined or not git_ref

    - name: 0 | Fail fast when the deployment profile is unknown
      ansible.builtin.fail:
        msg: "deploy_profile must be one of: production, vm-test"
      when: deploy_profile not in ['production', 'vm-test']

    # First deploy only: resolve the age key up front so every interactive
    # prompt (sudo, SSH key passphrase, age key) happens before the long
    # preflight and build.
    - name: 0 | Check whether the profile env exists on the server
      ansible.builtin.stat:
        path: "{{ env_prod_path }}"
      register: env_prod_exists_early

    - name: 0 | Show the age private key prompt
      ansible.builtin.debug:
        msg: "Enter the AGE private key (AGE-SECRET-KEY-...; input is hidden):"
      become: false
      run_once: true
      when:
        - not env_prod_exists_early.stat.exists
        - not lookup('env', 'AGE_PRIVATE_KEY')

    - name: 0 | Read the age private key
      ansible.builtin.pause:
        prompt: ""
        echo: false
      register: age_key_prompt
      become: false
      run_once: true
      no_log: true
      when:
        - not env_prod_exists_early.stat.exists
        - not lookup('env', 'AGE_PRIVATE_KEY')

    - name: 0 | Resolve the age private key
      ansible.builtin.set_fact:
        age_private_key: >-
          {{
            lookup('env', 'AGE_PRIVATE_KEY')
            or (age_key_prompt.user_input | default('') | trim)
          }}
      no_log: true
      when: not env_prod_exists_early.stat.exists

    # ---------------------------------------------------------------- 0
    # Docker is a prerequisite, not something the playbook installs. The local
    # registry is served over HTTP, so the daemon must trust it explicitly
    # (current Docker trusts 127.0.0.0/8 implicitly, but that is not guaranteed
    # to last). Host:port insecure registries appear in RegistryConfig.IndexConfigs
    # with Secure=false (CIDR entries live in InsecureRegistryCIDRs), and
    # insecure-registries supports a live reload, so this never restarts a live
    # daemon.
    - name: 0 | Check the Docker Engine and registry trust
      ansible.builtin.command:
        cmd: docker info --format "{% raw %}{{json .RegistryConfig.IndexConfigs}}{% endraw %}"
      register: docker_registry_indexes
      changed_when: false
      failed_when: false

    - name: 0 | Fail when the Docker Engine is not available
      ansible.builtin.fail:
        msg: >-
          Docker Engine 23+ must be installed and running on the target before
          deploying (see devops/deploy/README.md); the playbook does not install it.
      when: docker_registry_indexes.rc != 0

    - name: 0 | Read the Docker Engine version
      ansible.builtin.command:
        cmd: docker version --format "{% raw %}{{.Server.Version}}{% endraw %}"
      register: docker_engine_version
      changed_when: false

    - name: 0 | Fail when the Docker Engine is older than 23
      ansible.builtin.assert:
        that:
          - docker_engine_version.stdout is version('23.0', '>=')
        fail_msg: "Docker Engine 23+ is required (found {{ docker_engine_version.stdout }})"

    - name: 0 | Ensure the local registry is trusted by the Docker daemon
      when: "'127.0.0.1:5000' not in docker_registry_indexes.stdout"
      block:
        - name: 0 | Read the current Docker daemon config
          ansible.builtin.slurp:
            src: /etc/docker/daemon.json
          register: docker_daemon_json
          failed_when: false

        - name: 0 | Parse the current Docker daemon config
          ansible.builtin.set_fact:
            docker_daemon_config: >-
              {{
                (docker_daemon_json.content | b64decode | from_json)
                if (docker_daemon_json.content is defined and docker_daemon_json.content)
                else {}
              }}

        - name: 0 | Add the local registry to the Docker daemon config
          ansible.builtin.set_fact:
            docker_daemon_config: >-
              {{
                docker_daemon_config
                | combine({
                    'insecure-registries': (
                      (docker_daemon_config['insecure-registries'] | default([]))
                      + ['127.0.0.1:5000']
                    ) | unique
                  })
              }}

        - name: 0 | Write the Docker daemon config
          ansible.builtin.copy:
            content: "{{ docker_daemon_config | to_nice_json }}\n"
            dest: /etc/docker/daemon.json
            owner: root
            group: root
            mode: "0644"

        - name: 0 | Reload the Docker daemon
          ansible.builtin.service:
            name: docker
            state: reloaded

        - name: 0 | Re-read the registry trust after the reload
          ansible.builtin.command:
            cmd: docker info --format "{% raw %}{{json .RegistryConfig.IndexConfigs}}{% endraw %}"
          register: docker_registry_indexes_after
          until: "'127.0.0.1:5000' in docker_registry_indexes_after.stdout"
          retries: 5
          delay: 1
          failed_when: false
          changed_when: false

        - name: 0 | Fail when the registry trust did not take effect
          ansible.builtin.assert:
            that:
              - "'127.0.0.1:5000' in docker_registry_indexes_after.stdout"
            fail_msg: >-
              Added 127.0.0.1:5000 to /etc/docker/daemon.json, but the running
              daemon does not report it after a live reload. Restart Docker
              during a maintenance window (`systemctl restart docker`) and
              re-run the deploy.

    - name: 0 | Install deployment dependencies (git, envsubst, age, curl, openssl)
      ansible.builtin.apt:
        name:
          - git
          - gettext-base
          - age
          - curl
          - openssl
        state: present
        update_cache: true
        force_apt_get: true

    # ---------------------------------------------------------------- 0a
    - name: 0a | Check the Swarm state
      ansible.builtin.command:
        cmd: docker info --format "{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}"
      register: swarm_state
      changed_when: false
      failed_when: false

    - name: 0a | Initialize the Swarm when inactive
      ansible.builtin.command: docker swarm init
      when: swarm_state.stdout != 'active'
      register: swarm_init
      failed_when:
        - swarm_init.rc != 0
        - "'already part of a swarm' not in swarm_init.stderr"

    # ---------------------------------------------------------------- 0b
    - name: 0b | Check the overlay network
      ansible.builtin.command:
        cmd: docker network inspect portfolio_prod --format "{% raw %}{{.Attachable}}{% endraw %}"
      register: network_inspect
      changed_when: false
      failed_when: false

    - name: 0b | Fail when the existing overlay network is not attachable
      ansible.builtin.assert:
        that:
          - network_inspect.stdout | trim == 'true'
        fail_msg: "portfolio_prod exists but is not attachable — recreate it with: docker network rm portfolio_prod"
      when: network_inspect.rc == 0

    - name: 0b | Create the overlay network when missing
      ansible.builtin.command: docker network create --driver overlay --attachable portfolio_prod
      when: network_inspect.rc != 0
      register: network_create
      failed_when:
        - network_create.rc != 0
        - "'already exists' not in network_create.stderr"

    # ---------------------------------------------------------------- 0c
    - name: 0c | Check the local registry container
      ansible.builtin.command: docker inspect registry
      register: registry_inspect
      changed_when: false
      failed_when: false

    - name: 0c | Create the registry data directory
      ansible.builtin.file:
        path: /opt/registry/data
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 0c | Run the local registry on loopback when missing
      ansible.builtin.command: >-
        docker run -d
        --name registry
        --restart unless-stopped
        -p 127.0.0.1:5000:5000
        -e REGISTRY_STORAGE_DELETE_ENABLED=true
        -v /opt/registry/data:/var/lib/registry
        registry:2
      when: registry_inspect.rc != 0
      register: registry_run
      failed_when:
        - registry_run.rc != 0
        - "'is already in use by container' not in registry_run.stderr"

    - name: 0c | Check whether the local registry container is up
      ansible.builtin.command: >-
        docker inspect --format "{% raw %}{{.State.Running}}{% endraw %}" registry
      register: registry_running
      changed_when: false
      failed_when: false

    - name: 0c | Start the local registry container when stopped
      ansible.builtin.command: docker start registry
      when:
        - registry_inspect.rc == 0
        - registry_running.stdout | trim != 'true'
      changed_when: true

    - name: 0c | Wait for the local registry to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/v2/
        status_code: 200
        use_proxy: false
      register: registry_ready
      until: (registry_ready.status | default(0)) == 200
      retries: 60
      delay: 2
      changed_when: false
      failed_when: false

    - name: 0c | Read the registry container state for diagnostics
      ansible.builtin.command: >-
        docker inspect --format "{% raw %}{{json .State}}{% endraw %}" registry
      register: registry_state
      changed_when: false
      failed_when: false

    - name: 0c | Read the registry logs for diagnostics
      ansible.builtin.command: docker logs --tail 50 registry
      register: registry_logs
      changed_when: false
      failed_when: false

    - name: 0c | Fail when the local registry did not start
      ansible.builtin.assert:
        that:
          - (registry_ready.status | default(0)) == 200
        fail_msg: >-
          The local registry did not answer on 127.0.0.1:5000 (status:
          {{ registry_ready.status | default('none') }}).
          {{ registry_state.stdout | default('') }}
          {{ registry_logs.stdout | default('') }}
          {{ registry_logs.stderr | default('') }}

    # ---------------------------------------------------------------- 0d
    - name: 0d | Check whether the profile env exists on the server
      ansible.builtin.stat:
        path: "{{ env_prod_path }}"
      register: env_prod_stat

    - name: 0d | Provision the profile env (first deploy only)
      when: not env_prod_stat.stat.exists
      block:
        - name: 0d.i | Assert the encrypted env file exists locally
          ansible.builtin.stat:
            path: "{{ local_env_age_file }}"
          delegate_to: localhost
          become: false
          run_once: true
          register: env_age_stat

        - name: 0d.i | Fail with a clear message when deploy-init was not run
          ansible.builtin.fail:
            msg: "{{ local_env_age_file | basename }} is missing locally — run the matching init target (`make deploy-init` / `make deploy-test-init`) and fill the CHANGE_ME keys first (devops/secrets/init.sh)"
          when: not env_age_stat.stat.exists

        - name: 0d.iii | Create the release root
          ansible.builtin.file:
            path: "{{ release_root }}"
            state: directory
            mode: "0755"

        - name: 0d.iii | Copy the encrypted env file to the server
          ansible.builtin.copy:
            src: "{{ local_env_age_file }}"
            dest: "{{ server_env_age_file }}"
            mode: "0600"

        - name: 0d.iv | Fail when the age private key is not provided
          ansible.builtin.fail:
            msg: "The age private key is required for the first deploy (see secrets-management.md)"
          when: age_private_key is not defined or not age_private_key

        - name: 0d.iv | Create a transient age identity on the server
          ansible.builtin.tempfile:
            state: file
            prefix: age-identity-
          register: age_identity

        - name: 0d.iv | Write the private key into the transient identity
          ansible.builtin.copy:
            content: "{{ age_private_key }}\n"
            dest: "{{ age_identity.path }}"
            mode: "0600"
          no_log: true

        - name: 0d.iv | Decrypt the encrypted env into the profile env
          ansible.builtin.command:
            cmd: >-
              age -d -i {{ age_identity.path }}
              -o {{ env_prod_path }}
              {{ server_env_age_file }}

        - name: 0d.v | Harden the profile env (root-owned, 0600)
          ansible.builtin.file:
            path: "{{ env_prod_path }}"
            owner: root
            group: root
            mode: "0600"

        - name: 0d.g | Assert the profile env exists with 0600 before proceeding
          ansible.builtin.stat:
            path: "{{ env_prod_path }}"
          register: env_prod_provisioned

        - name: 0d.g | Assert the profile env ownership and permissions
          ansible.builtin.assert:
            that:
              - env_prod_provisioned.stat.exists
              - env_prod_provisioned.stat.mode == "0600"
              - env_prod_provisioned.stat.pw_name == "root"
      always:
        - name: 0d.vi | Shred the transient identity and the encrypted file
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/scripts/shred-files.sh
              "{{ age_identity.path | default('') }}"
              "{{ server_env_age_file }}"
          changed_when: false

    - name: 0d | Sweep provisioning artifacts left by interrupted runs
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/shred-files.sh
          "{{ server_env_age_file }}"
          "/tmp/age-identity-*"
      changed_when: false

    # ---------------------------------------------------------------- 0e
    - name: 0e | Read the deployed domain
      ansible.builtin.command:
        cmd: sed -n 's/^DOMAIN=//p' {{ env_prod_path }}
      register: deployed_domain
      changed_when: false

    - name: 0e | Fail when the provided profile has no usable domain
      ansible.builtin.assert:
        that:
          - (deployed_domain.stdout | trim) not in ['', 'CHANGE_ME']
        fail_msg: "DOMAIN in {{ env_prod_path }} must be the certificate's hostname (vm-test profile)"
      when: tls_mode == 'provided'

    - name: 0e | Resolve the expected certificate directory
      ansible.builtin.set_fact:
        provided_cert_dir: "{{ tls_root }}/live/{{ deployed_domain.stdout | trim }}"
      when: tls_mode == 'provided'

    - name: 0e | Check the provided certificate files
      ansible.builtin.stat:
        path: "{{ provided_cert_dir }}/{{ item }}"
      loop:
        - fullchain.pem
        - privkey.pem
      register: provided_certs
      when: tls_mode == 'provided'

    - name: 0e | Fail when tls_mode=provided and the certificates are missing
      ansible.builtin.assert:
        that:
          - provided_certs.results | selectattr('stat.exists') | list | length == 2
        fail_msg: >-
          tls_mode=provided expects {{ provided_cert_dir }}/fullchain.pem and
          {{ provided_cert_dir }}/privkey.pem on the server
          (DOMAIN={{ deployed_domain.stdout | trim }})
      when: tls_mode == 'provided'

    - name: 0e | Verify the provided certificate matches the domain
      ansible.builtin.command:
        cmd: >-
          openssl x509 -noout -checkhost {{ deployed_domain.stdout | trim }}
          -in {{ provided_cert_dir }}/fullchain.pem
      changed_when: false
      when: tls_mode == 'provided'

    # ---------------------------------------------------------------- 1
    - name: 1 | Resolve the repository URL
      ansible.builtin.set_fact:
        git_repo: "{{ portfolio_git_repo | default(lookup('env', 'GIT_REPO')) }}"

    - name: 1 | Fail when the repository URL is not set
      ansible.builtin.fail:
        msg: "portfolio_git_repo is not set in host_vars/<host>.yml (or GIT_REPO in the environment)"
      when: not git_repo

    - name: 1 | Check the release directory
      ansible.builtin.stat:
        path: "{{ release_root }}/releases/{{ git_ref }}/.git"
      register: release_git_stat

    - name: 1 | Clone the repository at git_ref (depth 1, unique release dir)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/clone-release.sh
          "{{ git_repo }}"
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ git_ref }}"
      when: not release_git_stat.stat.exists

    # ---------------------------------------------------------------- 2
    - name: 2 | Read the image manifest
      ansible.builtin.slurp:
        src: "{{ release_root }}/releases/{{ git_ref }}/devops/deploy/manifest.yml"
      register: manifest_file

    - name: 2 | Parse the image manifest
      ansible.builtin.set_fact:
        manifest: "{{ manifest_file.content | b64decode | from_yaml }}"

    # ---------------------------------------------------------------- 3
    - name: 3 | Inspect the image tag of each running service
      ansible.builtin.command:
        cmd: >-
          docker service inspect portfolio_{{ item.key }}
          --format "{% raw %}{{.Spec.TaskTemplate.ContainerSpec.Image}}{% endraw %}"
      loop: "{{ manifest.services | dict2items }}"
      register: deployed_images
      changed_when: false
      failed_when: false

    - name: 3 | Normalize the deployed tags (empty when the service is absent)
      ansible.builtin.set_fact:
        deployed_tags: >-
          {{
            deployed_tags | default({})
            | combine({
                item.item.key: (
                  (item.stdout | default('') | trim).split('@')[0].rsplit(':', 1)[-1]
                ) if (item.stdout | default('')) else ''
              })
          }}
      loop: "{{ deployed_images.results }}"
      changed_when: false

    - name: 3 | Initialize the list of services to rebuild
      ansible.builtin.set_fact:
        changed_services: []

    - name: 3 | Mark services whose deployed tag differs from the manifest
      ansible.builtin.set_fact:
        changed_services: "{{ changed_services | default([]) + [item.key] }}"
      loop: "{{ manifest.services | dict2items }}"
      vars:
        running_tag: "{{ deployed_tags.get(item.key, '') }}"
      when: running_tag != item.value
      changed_when: false

    - name: 3c | Check whether the database service already exists
      ansible.builtin.command: docker service inspect portfolio_db
      register: db_service_inspect
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------------- 4
    # The PHP image bakes config:cache at build time. The env file is passed
    # to the build as a BuildKit secret (build-php-images.sh): sourcing it in
    # the shell would not reach the build and would freeze defaults. The
    # resulting image layers hold the baked config, kept in the host-local
    # registry only (the same trust domain as the plaintext env file).
    - name: 4 | Hash the profile env on the server
      ansible.builtin.command:
        cmd: sha256sum {{ env_prod_path }}
      register: env_sha
      changed_when: false

    - name: 4 | Check for a previously recorded env hash
      ansible.builtin.stat:
        path: "{{ env_sha_path }}"
      register: env_sha_record_stat
      changed_when: false

    - name: 4 | Read the previously recorded env hash
      ansible.builtin.slurp:
        src: "{{ env_sha_path }}"
      register: env_sha_record
      when: env_sha_record_stat.stat.exists

    - name: 4 | Record whether a rebuild is needed for the baked env
      ansible.builtin.set_fact:
        env_changed: >-
          {{
            env_sha.stdout.split(' ')[0]
            != ((env_sha_record.content | default('')) | b64decode | trim)
          }}
      changed_when: false

    # The PHP image needs public/build/manifest.json at runtime and nginx
    # serves the hashed files, so the client build runs once into the release
    # directory before either image is built. It also covers an env-only
    # rebuild of the PHP image, where the release clone has no build output.
    - name: 4 | Build the frontend assets (Vite manifest + hashed files)
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/build-assets.sh {{ release_root }}/releases/{{ git_ref }}"
      when: >-
        (changed_services | intersect(['app', 'queue', 'scheduler', 'nginx'])) | length > 0
        or (env_changed is defined and env_changed)

    - name: 4a | Build + push the PHP-FPM image (app/queue/scheduler share the same Dockerfile)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/build-php-images.sh
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ env_prod_path }}"
          "{{ manifest.services.app }}"
          "{{ manifest.services.queue }}"
          "{{ manifest.services.scheduler }}"
      when: >-
        (changed_services | intersect(['app', 'queue', 'scheduler'])) | length > 0
        or (env_changed is defined and env_changed)

    - name: 4b | Build the node SSR image
      ansible.builtin.command:
        cmd: >-
          docker build
          --pull
          -f devops/docker/node/Dockerfile
          -t 127.0.0.1:5000/portfolio-node:{{ manifest.services.node }}
          .
      args:
        chdir: "{{ release_root }}/releases/{{ git_ref }}"
      when: "'node' in changed_services"

    - name: 4b | Push the node SSR image
      ansible.builtin.command:
        cmd: docker push 127.0.0.1:5000/portfolio-node:{{ manifest.services.node }}
      when: "'node' in changed_services"

    - name: 4c | Build the nginx image
      ansible.builtin.command:
        cmd: >-
          docker build
          --pull
          -f devops/docker/nginx/Dockerfile
          -t 127.0.0.1:5000/portfolio-nginx:{{ manifest.services.nginx }}
          .
      args:
        chdir: "{{ release_root }}/releases/{{ git_ref }}"
      when: "'nginx' in changed_services"

    - name: 4c | Push the nginx image
      ansible.builtin.command:
        cmd: docker push 127.0.0.1:5000/portfolio-nginx:{{ manifest.services.nginx }}
      when: "'nginx' in changed_services"

    # ---------------------------------------------------------------- 5
    # `migrate --force` is idempotent, so it runs on every deploy while the
    # database exists — this also converges a retry after a failed deploy,
    # where the app tag already matches and no image is rebuilt.
    - name: 5 | Run pending migrations against the running database
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/migrate.sh
          "{{ env_prod_path }}"
          "{{ manifest.services.app }}"
      when: db_service_inspect.rc == 0

    # ---------------------------------------------------------------- 6
    - name: 6 | Deploy the stack
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/deploy-stack.sh
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ env_prod_path }}"
          "{{ manifest.services.app }}"
          "{{ manifest.services.node }}"
          "{{ manifest.services.nginx }}"
          "{{ compose_overlay if tls_mode == 'provided' else '' }}"

    - name: 6 | Force a rolling restart when only the baked env changed
      ansible.builtin.command:
        cmd: docker service update --force portfolio_{{ item }}
      loop:
        - app
        - queue
        - scheduler
      when: env_changed is defined and env_changed
      changed_when: false

    - name: 6b | Run pending migrations on the first deploy
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/migrate.sh
          "{{ env_prod_path }}"
          "{{ manifest.services.app }}"
          true
      when: db_service_inspect.rc != 0

    # ---------------------------------------------------------------- 7
    - name: 7 | Wait for the stack to converge
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/wait-for-convergence.sh {{ deploy_wait_seconds }}"

    # The production stack must have the portfolio/backups buckets and the
    # scoped backups user before the app serves uploads or runs a backup.
    # RustFS is healthy after convergence; the script retries briefly anyway.
    - name: 7b | Provision RustFS buckets and the backups user
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/provision-rustfs.sh
          portfolio_prod
          "{{ env_prod_path }}"
          "{{ release_root }}/releases/{{ git_ref }}/devops/deploy/rustfs/backups-rw.json"

    - name: 7 | Record the deployed env hash
      ansible.builtin.copy:
        content: "{{ env_sha.stdout.split(' ')[0] }}\n"
        dest: "{{ env_sha_path }}"
        mode: "0600"

    # ---------------------------------------------------------------- 8
    - name: 8 | Prune old image tags from the registry (keep current + previous)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/registry-prune.py
          '{{ deployed_tags | to_json }}'
          '{{ manifest.services | to_json }}'
      register: registry_prune

    - name: 8 | Run registry garbage collection when tags were deleted
      ansible.builtin.command:
        cmd: docker exec registry registry garbage-collect /etc/docker/registry/config.yml
      when: "'deleted=' in registry_prune.stdout and 'deleted=0' not in registry_prune.stdout"
      changed_when: false

    - name: 8 | Print the deployed service state
      ansible.builtin.command:
        cmd: >-
          docker service ls --filter name=portfolio_
          --format "{% raw %}{{.Name}}\t{{.Replicas}}\t{{.Image}}{% endraw %}"
      changed_when: false

    # ---------------------------------------------------------------- 9
    - name: 9 | Find a running app container
      ansible.builtin.command:
        cmd: docker ps --filter name=portfolio_app --format "{% raw %}{{.ID}}{% endraw %}"
      register: app_containers
      changed_when: false

    - name: 9 | Fail when no app container is running
      ansible.builtin.assert:
        that:
          - app_containers.stdout_lines | length > 0
        fail_msg: "no running portfolio_app container found"

    - name: 9 | Resolve the initial admin identity
      ansible.builtin.set_fact:
        admin_login: "{{ lookup('env', 'ADMIN_LOGIN') | default('admin', true) }}"
        admin_email: >-
          {{
            lookup('env', 'ADMIN_EMAIL')
            | default('admin@' ~ (deployed_domain.stdout | trim), true)
          }}

    - name: 9 | Create the initial admin when missing
      ansible.builtin.command:
        cmd: >-
          docker exec {{ app_containers.stdout_lines | first }}
          php artisan admin:create
          --login={{ admin_login }}
          --email={{ admin_email }}
          --generate
          --no-interaction
      register: admin_create
      changed_when: "'Admin account created' in admin_create.stdout"
      failed_when:
        - admin_create.rc != 0
        - "'An admin account already exists' not in admin_create.stdout"
        - "'An admin account already exists' not in admin_create.stderr"

    - name: 9 | Show the generated admin credentials
      ansible.builtin.debug:
        msg: "{{ admin_create.stdout_lines }}"
      when: "'Admin account created' in admin_create.stdout"

    - name: 9 | Report when the admin already exists
      ansible.builtin.debug:
        msg: "Admin account already exists — left unchanged."
      when: >-
        'An admin account already exists' in admin_create.stdout
        or 'An admin account already exists' in admin_create.stderr
