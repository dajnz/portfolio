---
# Deployment playbook — devops.md "Ansible Deployment Playbook".
#
# Invoked via `make deploy GIT_REF=<tag-or-commit>` (repo-root Makefile), on
# a fresh Ubuntu server. Runs the steps against the `production` host of
# devops/deploy/hosts.yml over SSH (no agent required — plain Ansible +
# SSH, credentials via PROD_HOST / PROD_USER / PROD_SSH_KEY env vars):
#
#   0. Pre-flight checks
#      a. docker swarm init when Swarm mode is inactive
#      b. create the portfolio_prod overlay network when missing
#      c. deploy the local image registry (127.0.0.1:5000) when missing
#      d. FIRST DEPLOY ONLY — provision /opt/portfolio/.env.prod from the
#         age-encrypted .env.prod.age generated by `make secrets-init`
#         (secrets-management.md step 3)
#   1. Clone the repository at git_ref (depth 1) into
#      /opt/portfolio/releases/<git_ref>
#   2. Read devops/deploy/manifest.yml (service -> image tag)
#   3. Compare the manifest tags with the tags of the running swarm services
#   4. Build + push only the images whose tag differs (or whose baked env
#      changed — the PHP image runs `php artisan config:cache` at build time,
#      which freezes env() values, so /opt/portfolio/.env.prod is sourced
#      into the docker build; user-approved deviation 2026-09-05)
#   5. Run `php artisan migrate --force` when the app tag changed
#   6. Deploy the stack (envsubst over docker-compose.prod.yml with the
#      production env exported — compose interpolation carries the DB/Redis/
#      RustFS/DOMAIN configuration into the db/redis/rustfs/nginx services)
#   7. Wait for all portfolio services to converge
#   8. Prune old image tags from the local registry (keep current + previous)
#      and run registry garbage collection
#
# Bash/Python snippets live in devops/deploy/scripts/ (shipped to the server
# via the `script:` module); this file stays a thin orchestrator of pure
# modules and docker CLI commands.
#
# Control-machine env vars: PROD_HOST, PROD_USER, PROD_SSH_KEY (inventory),
# GIT_REPO (repository clone URL — required), AGE_PRIVATE_KEY (required only
# on the very first deploy, when .env.prod does not exist on the server yet).
- name: Deploy the portfolio stack
  hosts: production
  gather_facts: false
  become: true
  vars:
    release_root: /opt/portfolio
    deploy_wait_seconds: 600

  tasks:
    - name: 0 | Fail fast when GIT_REF is missing
      ansible.builtin.fail:
        msg: "git_ref is required — usage: make deploy GIT_REF=<tag-or-commit>"
      when: git_ref is not defined or not git_ref

    - name: 0 | Install deployment dependencies (git, envsubst, age, curl)
      ansible.builtin.apt:
        name:
          - git
          - gettext-base
          - age
          - curl
        state: present
        update_cache: true
        force_apt_get: true

    # ---------------------------------------------------------------- 0a
    - name: 0a | Check the Swarm state
      ansible.builtin.command:
        cmd: docker info --format "{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}"
      register: swarm_state
      changed_when: false
      failed_when: false

    - name: 0a | Initialize the Swarm when inactive
      ansible.builtin.command: docker swarm init
      when: swarm_state.stdout != 'active'
      register: swarm_init
      failed_when:
        - swarm_init.rc != 0
        - "'already part of a swarm' not in swarm_init.stderr"

    # ---------------------------------------------------------------- 0b
    - name: 0b | Check the overlay network
      ansible.builtin.command: docker network inspect portfolio_prod
      register: network_inspect
      changed_when: false
      failed_when: false

    - name: 0b | Create the overlay network when missing
      ansible.builtin.command: docker network create --driver overlay portfolio_prod
      when: network_inspect.rc != 0
      register: network_create
      failed_when:
        - network_create.rc != 0
        - "'already exists' not in network_create.stderr"

    # ---------------------------------------------------------------- 0c
    - name: 0c | Check the local registry service
      ansible.builtin.command: docker service inspect registry
      register: registry_inspect
      changed_when: false
      failed_when: false

    - name: 0c | Deploy the local registry when missing
      ansible.builtin.command: >-
        docker service create
        --name registry
        --publish published=5000,target=5000,mode=host
        --constraint node.role==manager
        --env REGISTRY_STORAGE_DELETE_ENABLED=true
        --mount type=bind,source=/opt/registry/data,destination=/var/lib/registry
        registry:2
      when: registry_inspect.rc != 0
      register: registry_create
      failed_when:
        - registry_create.rc != 0
        - "'already exists' not in registry_create.stderr"

    # ---------------------------------------------------------------- 0d
    - name: 0d | Check whether the production env exists on the server
      ansible.builtin.stat:
        path: "{{ release_root }}/.env.prod"
      register: env_prod_stat

    - name: 0d | Provision the production env (first deploy only)
      when: not env_prod_stat.stat.exists
      block:
        - name: 0d.i | Assert .env.prod.age exists locally
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../../.env.prod.age"
          delegate_to: localhost
          run_once: true
          register: env_age_stat

        - name: 0d.i | Fail with a clear message when `make secrets-init` was not run
          ansible.builtin.fail:
            msg: ".env.prod.age is missing locally — run `make secrets-init` and fill the CHANGE_ME keys first (devops/secrets/init.sh)"
          when: not env_age_stat.stat.exists

        - name: 0d.iii | Create the release root
          ansible.builtin.file:
            path: "{{ release_root }}"
            state: directory
            mode: "0755"

        - name: 0d.iii | Copy the encrypted env file to the server
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../.env.prod.age"
            dest: "{{ release_root }}/.env.prod.age"
            mode: "0600"

        - name: 0d.iv | Read AGE_PRIVATE_KEY from the control environment
          ansible.builtin.set_fact:
            age_private_key: "{{ lookup('env', 'AGE_PRIVATE_KEY') }}"
          no_log: true

        - name: 0d.iv | Fail when AGE_PRIVATE_KEY is not set
          ansible.builtin.fail:
            msg: "AGE_PRIVATE_KEY env var is required for the first deploy (see secrets-management.md)"
          when: not age_private_key

        - name: 0d.iv | Create a transient age identity on the server
          ansible.builtin.tempfile:
            state: file
            prefix: age-identity-
          register: age_identity

        - name: 0d.iv | Write the private key into the transient identity
          ansible.builtin.copy:
            content: "{{ age_private_key }}\n"
            dest: "{{ age_identity.path }}"
            mode: "0600"
          no_log: true

        - name: 0d.iv | Decrypt .env.prod.age into .env.prod
          ansible.builtin.command:
            cmd: >-
              age -d -i {{ age_identity.path }}
              -o {{ release_root }}/.env.prod
              {{ release_root }}/.env.prod.age

        - name: 0d.v | Harden .env.prod (root-owned, 0600)
          ansible.builtin.file:
            path: "{{ release_root }}/.env.prod"
            owner: root
            group: root
            mode: "0600"

        - name: 0d.g | Assert .env.prod exists with 0600 before proceeding
          ansible.builtin.stat:
            path: "{{ release_root }}/.env.prod"
          register: env_prod_provisioned

        - name: 0d.g | Assert .env.prod ownership and permissions
          ansible.builtin.assert:
            that:
              - env_prod_provisioned.stat.exists
              - env_prod_provisioned.stat.mode == "0600"
              - env_prod_provisioned.stat.pw_name == "root"
      always:
        - name: 0d.vi | Shred the transient identity and the encrypted file
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/scripts/shred-files.sh
              "{{ age_identity.path | default('') }}"
              "{{ release_root }}/.env.prod.age"
          changed_when: false

    - name: 0d | Sweep provisioning artifacts left by interrupted runs
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/shred-files.sh
          "{{ release_root }}/.env.prod.age"
          "/tmp/age-identity-*"
      changed_when: false

    # ---------------------------------------------------------------- 1
    - name: 1 | Resolve the repository URL
      ansible.builtin.set_fact:
        git_repo: "{{ lookup('env', 'GIT_REPO') }}"

    - name: 1 | Fail when GIT_REPO is not set
      ansible.builtin.fail:
        msg: "GIT_REPO env var is not set (the repository clone URL, e.g. https://github.com/org/portfolio.git)"
      when: not git_repo

    - name: 1 | Check the release directory
      ansible.builtin.stat:
        path: "{{ release_root }}/releases/{{ git_ref }}/.git"
      register: release_git_stat

    - name: 1 | Clone the repository at git_ref (depth 1, unique release dir)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/clone-release.sh
          "{{ git_repo }}"
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ git_ref }}"
      when: not release_git_stat.stat.exists

    # ---------------------------------------------------------------- 2
    - name: 2 | Read the image manifest
      ansible.builtin.include_vars:
        file: "{{ release_root }}/releases/{{ git_ref }}/devops/deploy/manifest.yml"
        name: manifest

    # ---------------------------------------------------------------- 3
    - name: 3 | Inspect the image tag of each running service
      ansible.builtin.command:
        cmd: >-
          docker service inspect portfolio_{{ item.key }}
          --format "{% raw %}{{.Spec.TaskTemplate.ContainerSpec.Image}}{% endraw %}"
      loop: "{{ manifest.services | dict2items }}"
      register: deployed_images
      changed_when: false
      failed_when: false

    - name: 3 | Normalize the deployed tags (empty when the service is absent)
      ansible.builtin.set_fact:
        deployed_tags: >-
          {{
            deployed_tags | default({})
            | combine({
                item.item.key: (
                  (item.stdout | default('') | trim).split('@')[0].rsplit(':', 1)[-1]
                ) if (item.stdout | default('')) else ''
              })
          }}
      loop: "{{ deployed_images.results }}"
      changed_when: false

    - name: 3 | Mark services whose deployed tag differs from the manifest
      ansible.builtin.set_fact:
        changed_services: "{{ changed_services | default([]) + [item.key] }}"
      loop: "{{ manifest.services | dict2items }}"
      vars:
        running_tag: "{{ deployed_tags.get(item.key, '') }}"
      when: running_tag != item.value
      changed_when: false

    # ---------------------------------------------------------------- 4
    # The PHP image bakes config:cache at build time, so the production env
    # must be visible to `docker build`. /opt/portfolio/.env.prod is sourced
    # into the build environment (user-approved 2026-09-05); the resulting
    # image layers hold the baked config, kept in the host-local registry
    # only (the same trust domain as the server's plaintext .env.prod).
    - name: 4 | Hash the production env on the server
      ansible.builtin.command:
        cmd: sha256sum {{ release_root }}/.env.prod
      register: env_sha
      changed_when: false

    - name: 4 | Check for a previously recorded env hash
      ansible.builtin.stat:
        path: "{{ release_root }}/.env.sha256"
      register: env_sha_record_stat
      changed_when: false

    - name: 4 | Read the previously recorded env hash
      ansible.builtin.slurp:
        path: "{{ release_root }}/.env.sha256"
      register: env_sha_record
      when: env_sha_record_stat.stat.exists

    - name: 4 | Record whether a rebuild is needed for the baked env
      ansible.builtin.set_fact:
        env_changed: >-
          {{
            env_sha.stdout.split(' ')[0]
            != (env_sha_record.content | b64decode | trim if env_sha_record is defined else '')
          }}
      changed_when: false

    - name: 4a | Build + push the PHP-FPM image (app/queue/scheduler share the same Dockerfile)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/build-php-images.sh
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ release_root }}/.env.prod"
          "{{ manifest.services.app }}"
          "{{ manifest.services.queue }}"
          "{{ manifest.services.scheduler }}"
      when: >-
        (changed_services | intersect(['app', 'queue', 'scheduler'])) | length > 0
        or (env_changed is defined and env_changed)

    - name: 4b | Build the node SSR image
      ansible.builtin.command:
        cmd: >-
          docker build
          --pull
          -f devops/docker/node/Dockerfile
          -t 127.0.0.1:5000/portfolio-node:{{ manifest.services.node }}
          .
      args:
        chdir: "{{ release_root }}/releases/{{ git_ref }}"
      when: "'node' in changed_services"

    - name: 4b | Push the node SSR image
      ansible.builtin.command:
        cmd: docker push 127.0.0.1:5000/portfolio-node:{{ manifest.services.node }}
      when: "'node' in changed_services"

    - name: 4c | Build the nginx image
      ansible.builtin.command:
        cmd: >-
          docker build
          --pull
          -t 127.0.0.1:5000/portfolio-nginx:{{ manifest.services.nginx }}
          devops/docker/nginx/
      args:
        chdir: "{{ release_root }}/releases/{{ git_ref }}"
      when: "'nginx' in changed_services"

    - name: 4c | Push the nginx image
      ansible.builtin.command:
        cmd: docker push 127.0.0.1:5000/portfolio-nginx:{{ manifest.services.nginx }}
      when: "'nginx' in changed_services"

    # ---------------------------------------------------------------- 5
    - name: 5 | Run pending migrations against the running database
      ansible.builtin.command: >-
        docker run --rm --network portfolio_prod
        --env-file {{ release_root }}/.env.prod
        127.0.0.1:5000/portfolio-app:{{ manifest.services.app }}
        php artisan migrate --force
      when: "'app' in changed_services"

    # ---------------------------------------------------------------- 6
    - name: 6 | Deploy the stack
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/deploy-stack.sh
          "{{ release_root }}/releases/{{ git_ref }}"
          "{{ release_root }}/.env.prod"
          "{{ manifest.services.app }}"
          "{{ manifest.services.node }}"
          "{{ manifest.services.nginx }}"

    - name: 6 | Force a rolling restart when only the baked env changed
      ansible.builtin.command:
        cmd: docker service update --force portfolio_{{ item }}
      loop:
        - app
        - queue
        - scheduler
      when: env_changed is defined and env_changed
      changed_when: false

    # ---------------------------------------------------------------- 7
    - name: 7 | Wait for the stack to converge
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/wait-for-convergence.sh {{ deploy_wait_seconds }}"

    - name: 7 | Record the deployed env hash
      ansible.builtin.copy:
        content: "{{ env_sha.stdout.split(' ')[0] }}\n"
        dest: "{{ release_root }}/.env.sha256"
        mode: "0600"

    # ---------------------------------------------------------------- 8
    - name: 8 | Prune old image tags from the registry (keep current + previous)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/registry-prune.py
          '{{ deployed_tags | to_json }}'
          '{{ manifest.services | to_json }}'
      register: registry_prune

    - name: 8 | Run registry garbage collection when tags were deleted
      ansible.builtin.command:
        cmd: docker exec registry registry garbage-collect /etc/docker/registry/config.yml
      when: "'deleted=' in registry_prune.stdout and 'deleted=0' not in registry_prune.stdout"
      changed_when: false

    - name: 8 | Print the deployed service state
      ansible.builtin.command:
        cmd: >-
          docker service ls --filter name=portfolio_
          --format "{% raw %}{{.Name}}\t{{.Replicas}}\t{{.Image}}{% endraw %}"
      changed_when: false
