name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commitlint can lint every commit of a PR.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-progress
      # Laravel Pint (PSR-12)
      - run: ./vendor/bin/pint --test
      - run: pnpm install --frozen-lockfile
      # Lint + format: TS, Vue script blocks
      - run: pnpm exec biome ci resources/js
      # Template linting only (.vue <template>)
      - run: pnpm exec eslint resources/js
      # CSS validation (non-blocking, warnings only)
      - run: pnpm exec stylelint "resources/js/**/*.vue" || true
      - run: pnpm exec spectral lint docs/openapi/openapi.yaml --ruleset .spectral.yaml
      - run: pnpm exec spectral lint docs/openapi/inertia/inertia.yaml --ruleset .spectral.yaml
      - name: Lint commit messages (commitlint)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -qE '^0+$' \
            && git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            pnpm exec commitlint --from "$BASE" --to HEAD
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # Generates API + Inertia types, then runs vue-tsc --noEmit.
      - run: pnpm run typecheck

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: pdo_pgsql, pgsql, mbstring, xml, zip, bcmath, intl, gd, exif, pcntl, redis
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: cp .env.example .env
      - run: composer install --no-progress
      - run: php artisan key:generate
      - run: |
          cat <<'EOF' >> .env
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=portfolio_test
          DB_USERNAME=test
          DB_PASSWORD=test
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF
      - run: php artisan migrate --env=testing
      # No --env=testing on the test command: it loads .env into the parent
      # process, so phpunit.xml's <env> overrides (CSRF, mail, session) do
      # not apply and the suite runs with the wrong environment.
      - run: php artisan test --parallel --recreate-databases --processes=4 --coverage --min=80

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

  # End-to-end suite. It runs the real app and Inertia SSR process against an
  # isolated database and RustFS service (see the step comments below).
  test-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, xml, zip, bcmath, intl, gd, exif, pcntl, redis
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: cp .env.example .env
      - run: composer install --no-progress
      - run: php artisan key:generate
      - run: |
          cat <<'EOF' >> .env
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=portfolio_test
          DB_USERNAME=test
          DB_PASSWORD=test
          APP_URL=http://127.0.0.1:8000
          CACHE_STORE=array
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          MAIL_MAILER=log
          RUSTFS_ENDPOINT=http://localhost:9000
          RUSTFS_BUCKET=portfolio
          RUSTFS_ACCESS_KEY=rustfsadmin
          RUSTFS_SECRET_KEY=rustfsadmin
          RUSTFS_USE_PATH_STYLE_ENDPOINT=true
          RUSTFS_BACKUPS_ACCESS_KEY=rustfsbackups
          RUSTFS_BACKUPS_SECRET_KEY=rustfsbackups
          RUSTFS_BACKUPS_BUCKET=backups
          EOF
      - run: php artisan migrate --env=testing
      # The official RustFS rc client provisions both buckets, the public
      # portfolio policy, and the scoped backups user used by the e2e
      # backup suite. It replaces the unavailable minio/mc image and aws-cli.
      - name: Provision RustFS
        run: |
          ./devops/deploy/scripts/provision-rustfs.sh \
            host .env devops/deploy/rustfs/backups-rw.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build -- --mode testing
      - run: pnpm run ssr:build -- --mode testing
      - run: pnpm exec playwright install --with-deps
      # global-setup.ts handles seeding (E2ETestSeeder is idempotent:
      # uses TRUNCATE ... CASCADE before insertions).
      # The Laravel app and the Inertia SSR Node process must run inside the
      # SAME step — GitHub Actions kills background processes between steps.
      # CI has no Nginx/DNS/`portfolio.dev.lan`, so Playwright points at
      # 127.0.0.1:8000.
      - name: Run Playwright e2e tests
        run: |
          php artisan serve --env=testing --port=8000 &
          php artisan inertia:start-ssr --env=testing &
          pnpm exec wait-on tcp:127.0.0.1:8000 && pnpm exec wait-on http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8000 pnpm exec playwright test

  # Performance-budget + Core Web Vitals spot check: Lighthouse collects the six
  # canonical public routes against the seeded demo content and asserts the
  # per-page gzipped-JS budgets from devops/lighthouse-config/budgets.json.
  # Budget assertions run at WARN severity and the job is continue-on-error,
  # so it is non-blocking by design. `php artisan serve` sends no gzip, so the
  # collected script sizes exceed the (gzipped) caps — the production nginx
  # stack gzips (see devops/lighthouse-config/README.md).
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, xml, zip, bcmath, intl, gd, exif, pcntl, redis
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: cp .env.example .env
      - run: composer install --no-progress
      - run: php artisan key:generate
      - run: |
          cat <<'EOF' >> .env
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=portfolio_test
          DB_USERNAME=test
          DB_PASSWORD=test
          APP_URL=http://127.0.0.1:8000
          CACHE_STORE=array
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          MAIL_MAILER=log
          EOF
      - run: php artisan migrate --env=testing
      - run: php artisan db:seed --class=E2ETestSeeder --env=testing
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build -- --mode testing
      - run: pnpm run ssr:build -- --mode testing
      # Playwright's chromium doubles as Lighthouse's Chrome; the lhci
      # config resolves it (devops/lighthouse-config/lighthouserc.cjs).
      - run: pnpm exec playwright install --with-deps chromium
      # Servers and the run share ONE step — GitHub Actions kills
      # background processes between steps (same constraint as test-e2e).
      - name: Run Lighthouse budget checks
        run: |
          php artisan serve --env=testing --port=8000 &
          php artisan inertia:start-ssr --env=testing &
          pnpm exec wait-on tcp:127.0.0.1:8000 && pnpm exec wait-on http://127.0.0.1:8000
          LH_URLS="http://127.0.0.1:8000/,http://127.0.0.1:8000/blog,http://127.0.0.1:8000/blog/understanding-laravel-queues,http://127.0.0.1:8000/projects,http://127.0.0.1:8000/projects/portfolio-platform,http://127.0.0.1:8000/experience" pnpm exec lhci autorun --config=devops/lighthouse-config/lighthouserc.cjs

  # On push to main (or a manual dispatch), detect changed service sources,
  # update the image tags in devops/deploy/manifest.yml and commit the manifest
  # back. The job pushes to main, so "GitHub Actions" must be on the main
  # ruleset's bypass list. The bot commit carries [skip ci] and does not
  # re-trigger the workflow.
  update-manifest:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, typecheck, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff base is the last commit that touched the
          # manifest, and the push guard compares HEAD with origin/main.
          fetch-depth: 0
          token: ${{ secrets.MANIFEST_PUSH_TOKEN }}
      - uses: mikefarah/yq@v4.54.1

      - name: Determine changed services
        id: changes
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Diff against the last commit that touched the manifest, not HEAD^:
          # changes from a run superseded by a newer push then still land in the
          # next run instead of being lost.
          BASE="$(git rev-list -1 HEAD^ -- devops/deploy/manifest.yml 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          changed() {
            git diff --name-only "$BASE" HEAD | grep -qE "$1" && echo "true" || echo "false"
          }

          # The client build output lands in both the PHP image (Vite manifest)
          # and the nginx image (hashed files), so a frontend change rebuilds
          # app/queue/scheduler and nginx as well as the SSR node image.
          BACKEND_CHANGED=$(changed '^(app/|config/|database/|routes/|bootstrap/|composer\.(json|lock)|devops/docker/php/|lang/|resources/views/)')
          FRONTEND_CHANGED=$(changed '^(resources/js/|resources/css/|resources/icons/|resources/images/|public/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|vite\.config\.ts|tailwind\.config\.js|devops/assets/|devops/docker/assets/)')
          NODE_CHANGED=$(changed '^devops/docker/node/')
          NGINX_CHANGED=$(changed '^devops/docker/nginx/')

          echo "backend_changed=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "node_changed=$NODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "nginx_changed=$NGINX_CHANGED" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        run: |
          MANIFEST="devops/deploy/manifest.yml"
          SHA="${{ steps.changes.outputs.sha }}"

          mkdir -p devops/deploy
          [ -f "$MANIFEST" ] || echo "services: {}" > "$MANIFEST"

          if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ] \
            || [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
            yq -i ".services.app = \"$SHA\"" "$MANIFEST"
            yq -i ".services.queue = \"$SHA\"" "$MANIFEST"
            yq -i ".services.scheduler = \"$SHA\"" "$MANIFEST"
          fi
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ] \
            || [ "${{ steps.changes.outputs.node_changed }}" = "true" ]; then
            yq -i ".services.node = \"$SHA\"" "$MANIFEST"
          fi
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ] \
            || [ "${{ steps.changes.outputs.nginx_changed }}" = "true" ]; then
            yq -i ".services.nginx = \"$SHA\"" "$MANIFEST"
          fi

          # Quote every tag so the file never mixes styles (yq must quote numeric-looking SHAs).
          yq -i '.services[] style="double"' "$MANIFEST"

          cat "$MANIFEST"

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add devops/deploy/manifest.yml

          if git diff --staged --quiet; then
            echo "Manifest is unchanged."
            exit 0
          fi

          git fetch origin
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer commit is on main; deferring to its run."
            exit 0
          fi

          git commit -m "chore(deploy): update image manifest [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
              echo "A newer commit is on main; deferring to its run."
              exit 0
            fi
            sleep 3
          done

          echo "Failed to push the manifest after 3 attempts." >&2
          exit 1
