version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /devops/docker/php
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /devops/docker/dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-prod:
        dependency-type: production
        update-types: [minor, patch]
      composer-dev:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Specific groups first: the first matching group wins.
      # Major updates are not listed, so they arrive as individual PRs.
      tiptap:
        patterns: ['@tiptap/*']
        update-types: [minor, patch]

      inertia:
        patterns: ['@inertiajs/*']
        update-types: [minor, patch]

      iconify:
        patterns: ['@iconify/*', '@iconify-json/*']
        update-types: [minor, patch]

      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@playwright/test'
          - '@vue/test-utils'
          - happy-dom
          - axe-core
          - axe-playwright
        update-types: [minor, patch]

      build:
        patterns:
          - vite
          - '@vitejs/*'
          - laravel-vite-plugin
          - typescript
          - vue-tsc
          - vue-component-type-helpers
          - tailwindcss
          - '@tailwindcss/*'
          - '@types/node'
          - '@types/*'
        update-types: [minor, patch]

      lint:
        patterns:
          - '@biomejs/*'
          - eslint
          - 'eslint-*'
          - '@typescript-eslint/*'
          - stylelint
          - 'stylelint-*'
          - html-validate
          - postcss-html
          - '@commitlint/*'
        update-types: [minor, patch]

      # Catch-all for remaining minor/patch updates.
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]

      npm-dev:
        dependency-type: development
        update-types: [minor, patch]

    open-pull-requests-limit: 5
