components:
  schemas:
    ProjectsIndexPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Projects/Public/Pages/ProjectsIndexPage'
            props:
              type: object
              properties:
                projects:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProjectCardData'
                skill_tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/SkillTagData'
                has_more:
                  type: boolean
                next_cursor:
                  type: string
                  nullable: true
                seo:
                  $ref: './shared.yaml#/components/schemas/SeoProps'

    ProjectDetailPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Projects/Public/Pages/ProjectDetailPage'
            props:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/ProjectDetailData'
                seo:
                  $ref: './shared.yaml#/components/schemas/SeoProps'

    ProjectsListPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Projects/Admin/Pages/ProjectsListPage'
            props:
              type: object
              properties:
                projects:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProjectTableRowData'
                featured_projects:
                  type: array
                  description: |
                    The featured projects of the live view, ordered by
                    `featured_sort_order` — the admin reorders them via
                    the list page's SortableList section
                    (admin-section-ui.md:338). Empty in the trashed view.
                  items:
                    $ref: '#/components/schemas/ProjectTableRowData'
                meta:
                  $ref: '../components/schemas.yaml#/components/schemas/PaginationMeta'

    ProjectFormPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Projects/Admin/Pages/ProjectFormPage'
            props:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/ProjectEditData'
                  nullable: true
                  description: Existing project on edit; null when creating.
                skills:
                  type: array
                  items:
                    $ref: '#/components/schemas/SkillTagData'
                articles:
                  type: array
                  description: |
                    The published blog articles the "Tech Writeup Article"
                    select offers (admin-section-ui.md:356) — only
                    published articles can be linked
                    (content-management.md:159). Empty when no article
                    is published yet.
                  items:
                    $ref: '#/components/schemas/PublishedArticleData'
                preview_url:
                  type: string
                  nullable: true
                  description: |
                    Signed 1-hour temporary preview URL
                    (`/admin/preview/projects/{project}`, routes.md:151) —
                    the preview button opens it in a new tab; null on the
                    create form (no project exists yet).

    ProjectCardData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        brief_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        preview_image:
          type: string
          nullable: true
        preview_image_alt:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        github_url:
          type: string
          nullable: true
        live_demo_url:
          type: string
          nullable: true
        is_featured:
          type: boolean
        tech_tags:
          type: array
          items:
            $ref: '#/components/schemas/SkillTagData'
        screenshots:
          type: array
          nullable: true
          items:
            type: object
            properties:
              image_path:
                type: string
              alt_text:
                type: object
                properties:
                  en:
                    type: string
                  ru:
                    type: string

    ProjectDetailData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        full_description:
          type: string
          nullable: true
        problem:
          type: string
          nullable: true
          description: Markdown — rendered via the shared content pipeline (content-management.md:131).
        solution:
          type: string
          nullable: true
          description: Markdown — rendered via the shared content pipeline (content-management.md:131).
        brief_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        preview_image:
          type: string
          nullable: true
        preview_image_alt:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        github_url:
          type: string
          nullable: true
        live_demo_url:
          type: string
          nullable: true
        is_featured:
          type: boolean
        tech_tags:
          type: array
          items:
            $ref: '#/components/schemas/SkillTagData'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotData'
        detail_items:
          type: array
          items:
            $ref: '#/components/schemas/DetailItemData'
        tech_writeup:
          type: object
          nullable: true
          description: |
            The linked tech-writeup article, resolved against the current
            publication state — present only while the article is
            published (content-management.md:133); null when no link is
            set or the article is unpublished/trashed. The stored
            `tech_writeup_article_id` is preserved in the DB either way.
          properties:
            id:
              type: integer
            slug:
              type: string
            title:
              type: string

    ProjectEditData:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: object
          description: Per-locale title values keyed by locale code.
          additionalProperties:
            type: string
        brief_description:
          type: object
          description: Per-locale brief description values keyed by locale code.
          additionalProperties:
            type: string
        full_description:
          type: object
          description: Per-locale Markdown values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true
        problem:
          type: object
          description: Per-locale Markdown values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true
        solution:
          type: object
          description: Per-locale Markdown values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true
        preview_image:
          type: string
          nullable: true
        preview_image_alt:
          type: object
          description: Per-locale alt text values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true
        github_url:
          type: string
          nullable: true
        live_demo_url:
          type: string
          nullable: true
        is_featured:
          type: boolean
        featured_sort_order:
          type: integer
          nullable: true
        is_published:
          type: boolean
        tech_writeup_article_id:
          type: integer
          nullable: true
          description: Linked blog article id (tech writeup). Null removes the link.
        tech_tags:
          type: array
          items:
            $ref: '#/components/schemas/SkillTagData'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotData'
        detail_items:
          type: array
          description: |
            Engineering detail items with per-locale title/description
            maps (the admin form edits them under LocaleTabs —
            `item.title.en` etc. in the mockup). Rows carry their id for
            the reconcile-by-id convention (A2).
          items:
            $ref: '#/components/schemas/ProjectDetailItemEditData'

    ProjectTableRowData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        preview_image:
          type: string
          nullable: true
          description: |
            The stored preview image path (A7 — public URL is
            `{APP_URL}/assets/{path}`); null when the project has no
            preview image (the Preview column shows a placeholder).
        is_published:
          type: boolean
        is_featured:
          type: boolean
        featured_sort_order:
          type: integer
          nullable: true
        tech_tags_count:
          type: integer
        tech_tags:
          type: array
          description: |
            The project's tech tags (icon + name) — the Tags column
            renders them as removable chips and the "+" button adds
            more (admin-section-ui.md:343).
          items:
            $ref: '#/components/schemas/SkillTagData'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PublishedArticleData:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string

    SkillTagData:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          description: Iconify identifier, e.g. `heroicons:code-bracket`.

    SkillGroupEditData:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
        sort_order:
          type: integer
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              icon:
                type: string
                description: Iconify identifier, e.g. `devicon:laravel`.
              proficiency:
                type: integer
              sort_order:
                type: integer
              include_in_resume:
                type: boolean

    ScreenshotData:
      type: object
      properties:
        id:
          type: integer
        image_path:
          type: string
        title:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        description:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        alt_text:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        sort_order:
          type: integer

    DetailItemData:
      type: object
      properties:
        id:
          type: integer
        icon:
          type: string
        title:
          type: string
        description:
          type: string

    ProjectDetailItemEditData:
      type: object
      properties:
        id:
          type: integer
          description: Existing row id on edit (reconcile-by-id, A2); absent on new rows.
        icon:
          type: string
          nullable: true
          description: Iconify identifier from the curated engineering set, e.g. `heroicons:shield-check`.
        title:
          type: object
          description: Per-locale title values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true
        description:
          type: object
          description: Per-locale description values keyed by locale code (nullable values).
          additionalProperties:
            type: string
            nullable: true

paths:
  /projects:
    get:
      tags: [Projects]
      summary: Projects index (public)
      description: Public projects card list with infinite scroll and tag filters.
      operationId: projectsIndexPage
      responses:
        '200':
          description: Project card list with infinite scroll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsIndexPageProps'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /projects/{project}:
    get:
      tags: [Projects]
      summary: Project detail (public)
      description: Public project detail page.
      operationId: projectDetailPage
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project slug (route binding {project:slug}).
      responses:
        '200':
          description: Project detail page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailPageProps'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/projects:
    get:
      tags: [Admin]
      summary: Projects list (admin)
      description: Admin projects management list.
      operationId: projectsListPage
      responses:
        '200':
          description: Admin projects management list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/projects/create:
    get:
      tags: [Admin]
      summary: Create project form
      description: Empty project creation form with available skills.
      operationId: projectCreatePage
      responses:
        '200':
          description: Project creation form with available skills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/projects/{project}/edit:
    get:
      tags: [Admin]
      summary: Edit project form
      description: Project edit form with existing data and skills.
      operationId: projectEditPage
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Project edit form with existing data and skills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/preview/projects/{project}:
    get:
      tags: [Admin]
      summary: Project preview (signed URL)
      description: |
        Signed temporary URL (1-hour expiry via URL::temporarySignedRoute), excluded
        from auth middleware. Renders the public project page, bypassing the
        is_published scope.
      operationId: projectPreviewPage
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public project page in preview mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

