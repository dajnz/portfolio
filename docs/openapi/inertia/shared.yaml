components:
  schemas:
    InertiaSharedProps:
      type: object
      required:
        - locale
        - theme
        - auth
        - ziggy
        - flash
        - notification
        - errors
        - cspNonce
        - featureFlags
        - settings
      properties:
        locale:
          type: string
          enum: [en, ru]
          description: Current locale from SetLocaleMiddleware.
        supported_locales:
          type: array
          items:
            type: string
            enum: [en, ru]
          description: Active locales from the `supported_locales` setting — the language selector and the per-locale editing tabs only offer these (disabled locales are neither editable nor deleted, 5.2 rework).
        theme:
          type: string
          enum: [light, dark]
          description: Current theme from ThemeMiddleware.
        auth:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/AdminUser'
          description: Authenticated admin user, or null for public pages.
        ziggy:
          type: object
          properties:
            url:
              type: string
            port:
              type: integer
              nullable: true
            defaults:
              type: object
            routes:
              type: object
          description: Ziggy route definitions for the route() helper in Vue.
        flash:
          type: object
          properties:
            success:
              type: string
              description: Success flash message.
            error:
              type: string
              description: Error flash message.
          description: Session flash messages.
        notification:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum: [success, error, warning, info]
            message:
              type: string
          required: [type, message]
          description: UI notification from session flash (via HandleInertiaRequests).
        errors:
          type: object
          additionalProperties:
            type: string
          description: Laravel validation errors bag (field name -> error message).
        cspNonce:
          type: string
          description: CSP nonce from CspNonceMiddleware.
        featureFlags:
          type: object
          properties:
            github_oauth:
              type: boolean
            social_reactions:
              type: boolean
          required: [github_oauth, social_reactions]
          description: Feature flags from FeatureFlagMiddleware.
        settings:
          type: object
          properties:
            locale:
              type: string
            theme:
              type: string
            items_per_page:
              type: integer
          description: Public settings from SettingsService.
        request_id:
          type: string
          format: uuid
          description: UUID request identifier for error reporting (error-handling.md:266-273).

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name (mirrors the login — B56).
        login:
          type: string
        email:
          type: string
        github_linked:
          type: boolean
        totp_enabled:
          type: boolean
        is_oauth_primary:
          type: boolean
          description: 'Computed: (github_id IS NOT NULL) && (password IS NULL) — B27/B35.'

    SeoProps:
      type: object
      required: [title, description]
      description: |
        Per-page SEO props passed by every public page controller (seo.md:18-31).
        Field names follow the Inertia snake_case convention (the seo.md
        TypeScript interface is camelCase — this schema is the committed
        contract). The Blade root layout renders these into `<title>`/`<meta>`
        during SSR; `useSeoUpdater` syncs them on client-side navigations.
      properties:
        title:
          type: string
          description: '<title> — already localized server-side (`__("seo.title_*")`).'
        description:
          type: string
          description: '<meta name="description"> — already localized server-side.'
        og_title:
          type: string
          description: Defaults to `title`.
        og_description:
          type: string
          description: Defaults to `description`.
        og_image:
          type: string
          description: 'Absolute URL; falls back to /images/og-default.png (1200x630) when absent.'
        og_image_width:
          type: integer
          description: Defaults to 1200.
        og_image_height:
          type: integer
          description: Defaults to 630.
        og_url:
          type: string
          description: Open Graph canonical URL.
        og_type:
          type: string
          enum: [website, article]
          description: Defaults to `website`.
        canonical_url:
          type: string
          description: '<link rel="canonical"> — always the slashless URL.'
        robots:
          type: string
          description: Reserved for future paginated content; 404s are Blade views with a hard-coded noindex.
        json_ld:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            JSON-LD structured data blocks (seo.md:82-188), localized
            server-side. Rendered into `application/ld+json` script tags
            carrying the CSP nonce by the Blade layout on SSR and replaced
            by `useSeoUpdater` on client-side navigations.
        article:
          type: object
          nullable: true
          description: |
            Blog-article Open Graph metadata (seo.md:65) — present only for
            article detail pages; rendered as `article:published_time`,
            `article:author` and one `article:tag` per tag/skill.
          properties:
            published_time:
              type: string
              nullable: true
              description: ISO 8601 publication time.
            author:
              type: string
              nullable: true
              description: The site owner's display name.
            tags:
              type: array
              items:
                type: string
              description: Article tags plus attached skills.
          additionalProperties: false

    InertiaPage:
      type: object
      required: [component, props]
      properties:
        component:
          type: string
          description: Vue page component name resolved by the Inertia protocol.
        props:
          allOf:
            - $ref: '#/components/schemas/InertiaSharedProps'
          description: Page props — the shared props are always present; page-specific schemas extend this object.
        url:
          type: string
          description: Current request URL.
        version:
          type: string
          description: Inertia asset version (manifest hash). Used for cache busting.

    InertiaErrorProps:
      allOf:
        - $ref: '#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              enum: ['Shared/CrossSurface/Pages/ErrorPage']
            props:
              type: object
              required: [status, message, request_id]
              properties:
                status:
                  type: integer
                  description: HTTP status code (403, 404, 419, 422, 429, 500, 503)
                message:
                  type: string
                  description: Human-readable error message from the errors locale group.
                request_id:
                  type: string
                  description: UUID request identifier for error reporting.
