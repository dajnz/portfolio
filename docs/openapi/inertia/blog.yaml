components:
  schemas:
    BlogIndexPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Public/Pages/BlogIndexPage'
            props:
              type: object
              properties:
                articles:
                  type: array
                  items:
                    $ref: '#/components/schemas/ArticleCardData'
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagData'
                years:
                  type: array
                  items:
                    type: integer
                has_more:
                  type: boolean
                next_cursor:
                  type: string
                  nullable: true
                seo:
                  $ref: './shared.yaml#/components/schemas/SeoProps'

    BlogArticlePageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Public/Pages/BlogArticlePage'
            props:
              type: object
              properties:
                article:
                  $ref: '#/components/schemas/ArticleDetailData'
                reactions:
                  type: object
                  properties:
                    user_reaction:
                      type: string
                      nullable: true
                    likes:
                      type: integer
                    dislikes:
                      type: integer
                seo:
                  $ref: './shared.yaml#/components/schemas/SeoProps'

    BlogListPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Admin/Pages/BlogListPage'
            props:
              type: object
              properties:
                articles:
                  type: array
                  items:
                    $ref: '#/components/schemas/ArticleTableRowData'
                meta:
                  $ref: '../components/schemas.yaml#/components/schemas/PaginationMeta'
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagData'

    BlogFormPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Admin/Pages/BlogFormPage'
            props:
              type: object
              properties:
                article:
                  $ref: '#/components/schemas/ArticleEditData'
                  nullable: true
                  description: Existing article on edit; null when creating.
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagData'
                  description: All article tags — the tag picker options.
                articles:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      slug:
                        type: string
                      title:
                        type: string
                  description: Published articles — the Related Articles multi-select options (B188 pattern).
                preview_url:
                  type: string
                  nullable: true
                  description: Signed 1-hour preview URL; null on the create form.

    TagListPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Admin/Pages/TagListPage'
            props:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagTableRowData'
                meta:
                  $ref: '../components/schemas.yaml#/components/schemas/PaginationMeta'

    TagFormPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Blog/Admin/Pages/TagFormPage'
            props:
              type: object
              properties:
                tag:
                  $ref: '#/components/schemas/TagEditData'
                  nullable: true
                  description: Existing tag on edit; null when creating.

    TagEditData:
      allOf:
        - $ref: '#/components/schemas/TagData'
        - type: object
          properties:
            names:
              type: object
              additionalProperties:
                type: string
              description: The per-locale names map (the LocaleTabs of the tag form).

    TagTableRowData:
      allOf:
        - $ref: '#/components/schemas/TagData'
        - type: object
          properties:
            articles_use_count:
              type: integer
              description: The number of articles using the tag (`article_tag_pivot` count).

    ArticleCardData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        short_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        reading_time_minutes:
          type: integer
        lead_image:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagData'

    ArticleDetailData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        short_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        reading_time_minutes:
          type: integer
        lead_image:
          type: string
          nullable: true
        lead_image_alt:
          type: object
          properties:
            en:
              type: string
            ru:
              type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagData'
        related:
          type: array
          items:
            $ref: '#/components/schemas/ArticleCardData'

    ArticleEditData:
      allOf:
        - $ref: '#/components/schemas/ArticleDetailData'
        - type: object
          properties:
            is_published:
              type: boolean
            is_featured:
              type: boolean
            related_article_ids:
              type: array
              items:
                type: integer
            skill_tags:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  icon:
                    type: string
                    nullable: true
              description: The tech skills attached via `article_skill_pivot` (the unified picker's pills).
            related:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
              description: Light related-article rows of the edit form (the public detail page serves the full card data).

    ArticleTableRowData:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        is_published:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        reading_time_minutes:
          type: integer
        views:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              type:
                type: string
                enum: [tag, skill]
          description: The unified tag chips of the Tags column (`article_tag_pivot` + `article_skill_pivot`).
        related:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
          description: The Related column chips (the bidirectional `related_articles` rows).

    TagData:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string

paths:
  /blog:
    get:
      tags: [Blog]
      summary: Blog index (public)
      description: Public blog article list with pagination and filter controls.
      operationId: blogIndexPage
      responses:
        '200':
          description: Paginated blog article list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogIndexPageProps'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /blog/{article}:
    get:
      tags: [Blog]
      summary: Blog article (public)
      description: Public blog article detail page.
      operationId: blogArticlePage
      parameters:
        - name: article
          in: path
          required: true
          schema:
            type: string
          description: Article slug (route binding {article:slug}).
      responses:
        '200':
          description: Blog article detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticlePageProps'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/blog:
    get:
      tags: [Admin]
      summary: Blog article list (admin)
      description: Admin blog article management list.
      operationId: blogListPage
      responses:
        '200':
          description: Admin blog management list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogListPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/blog/create:
    get:
      tags: [Admin]
      summary: Create blog article form
      description: Empty blog article creation form.
      operationId: blogCreatePage
      responses:
        '200':
          description: Empty blog creation form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/blog/{article}/edit:
    get:
      tags: [Admin]
      summary: Edit blog article form
      description: Blog article edit form with existing data.
      operationId: blogEditPage
      parameters:
        - name: article
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Blog article edit form with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/tags:
    get:
      tags: [Admin]
      summary: Tags management list
      description: Admin article tags management list.
      operationId: tagsListPage
      responses:
        '200':
          description: Tags management list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/tags/create:
    get:
      tags: [Admin]
      summary: Create article tag form
      description: Empty tag creation form (slug + per-locale name).
      operationId: tagCreatePage
      responses:
        '200':
          description: Empty tag creation form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/tags/{tag}/edit:
    get:
      tags: [Admin]
      summary: Edit article tag form
      description: Tag edit form with existing data.
      operationId: tagEditPage
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tag edit form with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagFormPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'

  /admin/preview/blog/{article}:
    get:
      tags: [Admin]
      summary: Blog article preview (signed URL)
      description: |
        Signed temporary URL (1-hour expiry via URL::temporarySignedRoute), excluded
        from auth middleware. Renders the public article page, bypassing the
        is_published scope.
      operationId: blogPreviewPage
      parameters:
        - name: article
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public blog article page in preview mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticlePageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
