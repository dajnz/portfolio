components:
  schemas:
    AnalyticsDashboardPageProps:
      allOf:
        - $ref: './shared.yaml#/components/schemas/InertiaPage'
        - type: object
          properties:
            component:
              type: string
              const: 'Analytics/Admin/Pages/AnalyticsDashboardPage'
            props:
              type: object
              properties:
                reports:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnalyticsReportData'

    AnalyticsReportData:
      type: object
      properties:
        report_type:
          type: string
          enum: [overall, blog, projects, feedback]
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        data:
          type: object
          description: Report-type-specific payload (views, unique_visitors, etc.).

paths:
  /admin/analytics:
    get:
      tags: [Admin]
      summary: Analytics dashboard
      description: Report selection and per-report data views for the admin analytics dashboard.
      operationId: analyticsDashboardPage
      responses:
        '200':
          description: Analytics reports for recent periods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardPageProps'
        '419':
          description: Session expired. Redirects to the login page.
          content:
            application/json:
              schema:
                $ref: './shared.yaml#/components/schemas/InertiaErrorProps'
