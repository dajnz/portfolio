components:
  schemas:
    # --- Response envelopes ---

    SuccessResponse:
      type: object
      required: [data]
      properties:
        data: {}

    SuccessResponseEmpty:
      type: object
      description: Response with no body (used for 201 / 204 / 200 no content).

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          default: 'The given data was invalid.'
        errors:
          type: object
          description: 'Field name → array of error messages.'
          additionalProperties:
            type: array
            items:
              type: string

    # --- Pagination ---

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    # --- Upload ---

    UploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [path, url, name, size]
          properties:
            path:
              type: string
              description: >-
                RustFS object path. Raster image uploads are stored as WebP
                (e.g. 'blog/abc123/image.webp'); GIF/PDF uploads keep their
                original extension.
            url:
              type: string
              format: uri
            name:
              type: string
              description: Original filename.
            size:
              type: integer
              description: Stored file size in bytes (the processed WebP for converted images).
              minimum: 0

    # --- Feedback ---

    FeedbackRequest:
      type: object
      required: [sender_name, sender_email, message]
      properties:
        sender_name:
          type: string
          maxLength: 100
        sender_email:
          type: string
          format: email
          maxLength: 255
        message:
          type: string
          maxLength: 5000
          minLength: 10

    # --- Blog Reactions ---

    ReactionRequest:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: [like, dislike]

    ReactionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [reaction, likes, dislikes]
          properties:
            reaction:
              type: string
              enum: [like, dislike]
              nullable: true
              description: The user's current reaction, or null if toggled off (undo).
            likes:
              type: integer
              minimum: 0
            dislikes:
              type: integer
              minimum: 0

    # --- Tags ---

    TagRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: object
          minProperties: 1
          properties:
            en:
              type: string
              maxLength: 100
            ru:
              type: string
              maxLength: 100

    TagResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: integer
            slug:
              type: string
            name:
              type: object
              properties:
                en:
                  type: string
                  nullable: true
                ru:
                  type: string
                  nullable: true

    # --- Analytics ---

    AnalyticsEvent:
      type: object
      required: [event_type, session_id]
      properties:
        event_type:
          type: string
          maxLength: 100
        session_id:
          type: string
          maxLength: 255
        page_type:
          type: string
          maxLength: 50
          description: |
            The public page kind the event happened on (ADR-0017): landing,
            blog_index, blog_article, projects_index, project_detail,
            experience. Nullable for pages outside the tracked set.
        page_entity_id:
          type: integer
          minimum: 1
          description: The entity id of the entity pages (blog_article / project_detail); null otherwise.
        page_url:
          type: string
          maxLength: 500
        metadata:
          type: object
          description: Event-specific payload.

    AnalyticsTrackRequest:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/AnalyticsEvent'

    # --- Upload ---

    UploadDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: RustFS path to delete.

    # --- Search / Autocomplete ---

    SkillSearchItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          description: Iconify icon identifier in {prefix}:{name} format (e.g. `devicon:laravel`).

    SkillSearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SkillSearchItem'

    TagSearchItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    TagSearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagSearchItem'

    UnifiedTagSearchItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [skill, tag]

    UnifiedTagSearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedTagSearchItem'

    # --- Dual-response: Blog ---

    ArticleItem:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        short_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Auto-set to now() on first publish. Immutable thereafter.
        reading_time_minutes:
          type: integer
        lead_image:
          type: string
          nullable: true
        lead_image_alt:
          type: object
          nullable: true
          description: |
            The per-locale alt labels of the lead image — null when
            `lead_image` is null.
          properties:
            en:
              type: string
            ru:
              type: string
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              slug:
                type: string
              name:
                type: string
        skill_tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              icon:
                type: string
                description: Iconify icon identifier, e.g. `heroicons:code-bracket`.

    BlogIndexResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArticleItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # --- Dual-response: Projects ---

    ProjectItem:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        brief_description:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Auto-set to now() on first publish. Immutable thereafter.
        preview_image:
          type: string
          nullable: true
        github_url:
          type: string
          nullable: true
        live_demo_url:
          type: string
          nullable: true
        is_featured:
          type: boolean
        tech_tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              icon:
                type: string
                description: Iconify identifier, e.g. `heroicons:code-bracket`.

    ProjectsIndexResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
